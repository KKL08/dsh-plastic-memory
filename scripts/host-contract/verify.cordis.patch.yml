# R1 宿主契约检查的 overlay（run.sh 会把 __VERIFY_URL__ 换成 verify-plugin 的 file:// URL）。
# 宿主 0.1.5 的 dsh-base 已自带 storage / storage-json / storage-domain 三件套，
# 这里重复 insert 同 id 会让宿主以 "duplicate loader entry id: storage" 拒启，故只补 base
# 不含的 workspace 一条；sessions / sessionQuery 同属 base 默认服务，无需 overlay。
- id: plastic-memory
  config:
    writeMode: proactive
    template: coding
- insert:
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: plastic-memory-host-contract
      name: __VERIFY_URL__
      inject: [tools]
