name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Published files stay on the whitelist
        run: |
          pnpm pack --dry-run 2>&1 | tee pack.log
          if grep -E '^\s*(src|tests|client|docs|e2e)/' pack.log; then echo 'unexpected files in the package'; exit 1; fi
          for f in lib/index.js lib/client.js locale/en.json locale/zh.json assets/icon.svg cordis.patch.yml; do
            grep -Eq "^\s*$f\s*$" pack.log || { echo "missing from the package: $f"; exit 1; }
          done
      - run: scripts/check-no-local-paths.sh
      - name: Cache the pinned dsh host
        uses: actions/cache@v4
        with:
          path: ~/.cache/dsh-plastic-memory
          key: dsh-host-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package.json') }}
      - run: pnpm host:smoke
      - run: pnpm host:contract

  # The oldest host the peer range admits (`>=x` on the dsh-* peers). The job
  # above runs on the pinned host; this one rewrites the dev dependencies to the
  # floor so a change that needs a newer host fails here instead of on users.
  host-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: node scripts/use-host.cjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Cache the floor dsh host
        uses: actions/cache@v4
        with:
          path: ~/.cache/dsh-plastic-memory
          key: dsh-host-floor-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: pnpm host:smoke
      - run: pnpm host:contract
