name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main gets its
# own group: a shared group would still drop a queued main run when a newer one
# arrives, and every merge must be checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/check-no-local-paths.sh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-check-node${{ matrix.node }}
          path: test-results/junit.xml
          retention-days: 14
      - run: pnpm build
      - run: scripts/check-pack-whitelist.sh
      - name: Cache the pinned dsh host
        uses: actions/cache@v6
        with:
          path: ~/.cache/dsh-plastic-memory
          key: dsh-host-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package.json') }}
      - run: pnpm host:smoke
      - run: pnpm host:contract

  # The oldest host the peer range admits (`>=x` on the dsh-* peers). The job
  # above runs on the pinned host; this one rewrites the dev dependencies to the
  # floor so a change that needs a newer host fails here instead of on users.
  host-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: node scripts/use-host.cjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The client tests import nothing from the host, so they don't change with its version.
      - run: pnpm exec vitest run --project node --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-host-floor-node22
          path: test-results/junit.xml
          retention-days: 14
      - name: Cache the floor dsh host
        uses: actions/cache@v6
        with:
          path: ~/.cache/dsh-plastic-memory
          key: dsh-host-floor-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: pnpm host:smoke
      - run: pnpm host:contract
