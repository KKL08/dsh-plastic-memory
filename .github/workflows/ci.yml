name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: scripts/check-pack-whitelist.sh
      - run: scripts/check-no-local-paths.sh
      - name: Cache the pinned dsh host
        uses: actions/cache@v6
        with:
          path: ~/.cache/dsh-plastic-memory
          key: dsh-host-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package.json') }}
      - run: pnpm host:smoke
      - run: pnpm host:contract

  # The oldest host the peer range admits (`>=x` on the dsh-* peers). The job
  # above runs on the pinned host; this one rewrites the dev dependencies to the
  # floor so a change that needs a newer host fails here instead of on users.
  host-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: node scripts/use-host.cjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The client tests import nothing from the host, so they don't change with its version.
      - run: pnpm exec vitest run --project node
      - name: Cache the floor dsh host
        uses: actions/cache@v6
        with:
          path: ~/.cache/dsh-plastic-memory
          key: dsh-host-floor-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: pnpm host:smoke
      - run: pnpm host:contract
